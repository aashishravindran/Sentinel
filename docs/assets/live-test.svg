<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Sentinel live test on AWS: Cognito users through AgentCore Gateway</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="627" fill="#ffffff"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Sentinel, live on AWS</text>
  <text x="352" y="52" font-size="18" fill="#475569">real Cognito users · real AgentCore Gateway · no AWS keys in the path</text>

  <!-- Personas -->
  <text x="105" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">5 demo users</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="40" y="116" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105" y="136" fill="#0f172a">alice · finance</text>
    <rect x="40" y="154" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105" y="174" fill="#0f172a">bob · eng</text>
    <rect x="40" y="192" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105" y="212" fill="#0f172a">charlie · all</text>
    <rect x="40" y="230" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105" y="250" fill="#0f172a">intern · public</text>
    <rect x="40" y="268" width="130" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/><text x="105" y="288" fill="#0f172a">root · admin</text>
  </g>

  <!-- Cognito -->
  <path d="M172,207 L206,207" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="210" y="150" width="160" height="116" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="290" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#701a75">Cognito</text>
  <text x="290" y="202" text-anchor="middle" font-size="13" fill="#86198f">user pool (Lite)</text>
  <text x="290" y="222" text-anchor="middle" font-size="13" fill="#86198f">admin-created only</text>
  <text x="290" y="242" text-anchor="middle" font-size="13" fill="#86198f">no identity pool</text>

  <path d="M372,207 L428,207" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="196" text-anchor="middle" font-size="12" fill="#64748b">JWT</text>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#64748b">sub</text>

  <!-- Gateway -->
  <rect x="432" y="96" width="736" height="200" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="452" y="124" font-size="17" font-weight="700" fill="#7c2d12">Amazon Bedrock AgentCore Gateway</text>

  <rect x="452" y="146" width="140" height="122" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="522" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#7c2d12">JWT authorizer</text>
  <text x="522" y="198" text-anchor="middle" font-size="12" fill="#9a3412">issuer + client</text>
  <text x="522" y="216" text-anchor="middle" font-size="12" fill="#9a3412">pinned</text>
  <text x="522" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">bad token → 401</text>

  <path d="M594,207 L614,207" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="618" y="146" width="168" height="122" rx="10" fill="#0f172a"/>
  <text x="702" y="172" text-anchor="middle" font-size="12" fill="#94a3b8">λ REQUEST interceptor</text>
  <text x="702" y="196" text-anchor="middle" font-size="13" fill="#e2e8f0">re-verify token</text>
  <text x="702" y="216" text-anchor="middle" font-size="13" fill="#e2e8f0">tags for sub, live</text>
  <text x="702" y="236" text-anchor="middle" font-size="13" fill="#e2e8f0">rebuild arguments</text>
  <text x="702" y="256" text-anchor="middle" font-size="13" fill="#e2e8f0">seal identity</text>

  <path d="M788,207 L808,207" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="812" y="146" width="160" height="122" rx="10" fill="#0f172a"/>
  <text x="892" y="172" text-anchor="middle" font-size="12" fill="#94a3b8">λ target (the tool)</text>
  <text x="892" y="200" text-anchor="middle" font-size="13" fill="#e2e8f0">open sealed identity</text>
  <text x="892" y="222" text-anchor="middle" font-size="13" fill="#e2e8f0">what_can_i_access</text>
  <text x="892" y="244" text-anchor="middle" font-size="13" fill="#e2e8f0">→ user + tags</text>

  <path d="M974,207 L994,207" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="998" y="146" width="152" height="122" rx="10" fill="#0f172a"/>
  <text x="1074" y="172" text-anchor="middle" font-size="12" fill="#94a3b8">λ RESPONSE interceptor</text>
  <text x="1074" y="200" text-anchor="middle" font-size="13" fill="#e2e8f0">re-verify token</text>
  <text x="1074" y="222" text-anchor="middle" font-size="13" fill="#e2e8f0">re-check results</text>
  <text x="1074" y="244" text-anchor="middle" font-size="13" fill="#e2e8f0">hide control args</text>

  <!-- Stores -->
  <rect x="618" y="320" width="340" height="50" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="788" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">DynamoDB · tags keyed by Cognito sub</text>
  <path d="M702,270 L702,316" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M892,270 L892,316" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M1074,270 L1074,296 L935,296 L935,316" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" fill="none"/>

  <rect x="998" y="320" width="170" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1083" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">CloudWatch</text>
  <text x="1083" y="360" text-anchor="middle" font-size="12" fill="#475569">user · tags · allow/deny</text>

  <!-- Results -->
  <text x="40" y="420" font-size="18" font-weight="700" fill="#0f172a">What the live run showed</text>
  <g font-size="14">
    <rect x="40" y="436" width="266" height="122" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="58" y="466" font-weight="700" fill="#14532d">Each user, their own tags</text>
    <text x="58" y="494" fill="#166534">alice → finance, public</text>
    <text x="58" y="516" fill="#166534">intern → public</text>
    <text x="58" y="538" fill="#166534">root (admin only) → denied</text>

    <rect x="320" y="436" width="266" height="122" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="338" y="466" font-weight="700" fill="#1e3a8a">Spoofing ignored</text>
    <text x="338" y="494" fill="#1e40af">intern sends</text>
    <text x="338" y="516" fill="#1e40af" font-family="ui-monospace, Menlo, monospace" font-size="13">user_id="charlie"</text>
    <text x="338" y="538" fill="#1e40af">→ still intern, still public</text>

    <rect x="600" y="436" width="266" height="122" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="618" y="466" font-weight="700" fill="#7f1d1d">Bad tokens stop at the door</text>
    <text x="618" y="494" fill="#991b1b">no token → 401</text>
    <text x="618" y="516" fill="#991b1b">garbage token → 401</text>
    <text x="618" y="538" fill="#991b1b">no Lambda ever runs</text>

    <rect x="880" y="436" width="288" height="122" rx="12" fill="#fefce8" stroke="#fde68a"/>
    <text x="898" y="466" font-weight="700" fill="#713f12">Revocation is instant</text>
    <text x="898" y="494" fill="#854d0e">remove alice's finance tag</text>
    <text x="898" y="516" fill="#854d0e">same token, next call</text>
    <text x="898" y="538" fill="#854d0e">→ public only, no redeploy</text>
  </g>
</svg>
