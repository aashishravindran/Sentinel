[project]
name = "sentinel-rag"
version = "0.1.0"
description = "Permission-aware RAG for AI agents: MCP server and AgentCore Gateway adapters over sentinel-engine"
requires-python = ">=3.11"
dependencies = [
    "sentinel-engine[sqlite,spicedb,aws,chroma]",
    "fastmcp>=3.1.1,<4",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "boto3-stubs[secretsmanager]>=1.43.111",
]

[tool.uv.sources]
sentinel-engine = { path = "../sentinel-engine", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require live backends (SpiceDB, ChromaDB, AWS)",
    "aws: tests that call a deployed AWS stack",
    "redteam: adversarial tests; the leak rate must stay at zero",
    "conformance: identical decisions across every adapter",
    "load: latency and recall benchmarks (not run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infra/cdk/cdk.out", "infra/cdk/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.pyright]
include = ["sentinel"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
