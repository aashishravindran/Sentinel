[project]
name = "sentinel-rag"
version = "0.1.0"
description = "Permission-aware RAG for AI agents: MCP server and AgentCore Gateway adapters over sentinel-engine"
requires-python = ">=3.11"
dependencies = [
    "sentinel-engine[sqlite,spicedb,aws,chroma]",
    "fastmcp>=3.1.1,<4",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv.sources]
sentinel-engine = { path = "../sentinel-engine", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that require live backends (SpiceDB, ChromaDB, AWS)",
]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
