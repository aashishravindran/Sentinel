[project]
name = "sentinel-rag"
version = "0.1.0"
description = "ABAC middleware for RAG pipelines via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
aws = [
    "aioboto3>=13.0",
    "boto3>=1.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
